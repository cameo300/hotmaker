<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1E3A32;
    --board-deep:#162C26;
    --board-line:#2F5449;
    --chalk:#E8F0EC;
    --chalk-dim:#9FB8AE;
    --paper:#EDF0EF;
    --card:#FFFFFF;
    --ink:#1A2724;
    --ink-soft:#5A6B66;
    --line:#D6DEDB;
    --brass:#B98A2E;
    --danger:#B4423A;
    --sidebar-w:264px;
    --radius:10px;
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* ---------- 로그인 ---------- */
  #gate{
    position:fixed;inset:0;z-index:100;display:flex;
    align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(120% 80% at 50% 0%, #27473D 0%, var(--board) 45%, var(--board-deep) 100%);
  }
  #gate::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(72deg, rgba(255,255,255,.025) 0 1px, transparent 1px 14px);
    mask-image:radial-gradient(70% 55% at 50% 45%, #000 0%, transparent 100%);
  }
  .gate-box{position:relative;z-index:1;width:100%;max-width:360px}
  .gate-title{
    margin:0 0 6px;color:var(--chalk);font-weight:700;
    font-size:clamp(28px,7vw,38px);letter-spacing:-.02em;line-height:1.2;
  }
  .gate-sub{margin:0 0 30px;color:var(--chalk-dim);font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:6px;color:var(--chalk-dim);font-size:13px}
  .field input{
    width:100%;padding:12px 14px;border:1px solid var(--board-line);
    border-radius:8px;background:rgba(255,255,255,.06);color:var(--chalk);
    font-size:16px;font-family:inherit;
  }
  .field input::placeholder{color:#6E8981}
  .field input:focus{border-color:var(--chalk-dim);background:rgba(255,255,255,.1);outline:none}
  #enter{
    width:100%;margin-top:8px;padding:13px;border:0;border-radius:8px;
    background:var(--chalk);color:var(--board-deep);font-weight:700;font-size:15px;cursor:pointer;
  }
  #enter:hover{background:#fff}
  #enter:disabled{opacity:.55;cursor:progress}
  #gate-msg{min-height:20px;margin-top:14px;color:#F0B4AE;font-size:13px}

  /* ---------- 앱 ---------- */
  #app{display:none;height:100%}
  #app.on{display:block}

  #topbar{
    display:none;position:sticky;top:0;z-index:30;
    align-items:center;gap:10px;height:56px;padding:0 12px;
    background:var(--board);color:var(--chalk);
    padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top));
  }
  #topbar strong{font-size:15px;font-weight:500}
  .icon-btn{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border:0;border-radius:8px;
    background:rgba(255,255,255,.1);color:var(--chalk);cursor:pointer;flex:none;
  }

  aside{
    position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
    display:flex;flex-direction:column;
    background:var(--board);color:var(--chalk);z-index:40;
  }
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--board-line)}
  .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .brand p{margin:4px 0 0;font-size:12px;color:var(--chalk-dim)}
  nav{flex:1;overflow-y:auto;padding:10px 0 20px;-webkit-overflow-scrolling:touch}
  .cat > button{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:13px 20px;border:0;background:none;color:var(--chalk);
    font-size:14.5px;font-weight:500;text-align:left;cursor:pointer;
  }
  .cat > button:hover{background:rgba(255,255,255,.06)}
  .caret{margin-left:auto;font-size:11px;color:var(--chalk-dim);transition:transform .18s ease}
  .cat.open .caret{transform:rotate(90deg)}
  .cat.open > button{color:#fff}
  .sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:var(--board-deep)}
  .cat.open .sub{max-height:340px}
  .sub button{
    display:block;width:100%;padding:11px 20px 11px 34px;border:0;background:none;
    color:var(--chalk-dim);font-size:14px;text-align:left;cursor:pointer;
    border-left:3px solid transparent;
  }
  .sub button:hover{color:var(--chalk);background:rgba(255,255,255,.05)}
  .sub button[aria-current="true"]{color:#fff;border-left-color:var(--brass);background:rgba(255,255,255,.07)}
  .side-foot{padding:14px 20px;border-top:1px solid var(--board-line)}
  .side-foot button{
    width:100%;padding:9px;border:1px solid var(--board-line);border-radius:8px;
    background:none;color:var(--chalk-dim);font-size:13px;cursor:pointer;
  }
  .side-foot button:hover{color:var(--chalk);border-color:var(--chalk-dim)}

  main{margin-left:var(--sidebar-w);height:100%;display:flex;flex-direction:column}
  .crumb{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);
  }
  .crumb h2{margin:0;font-size:15px;font-weight:700}
  .crumb span{font-size:13px;color:var(--ink-soft)}
  .crumb .spacer{margin-left:auto}
  .ghost{
    padding:7px 12px;border:1px solid var(--line);border-radius:7px;
    background:var(--card);font-size:13px;color:var(--ink-soft);cursor:pointer;
  }
  .ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
  .stage{flex:1;position:relative;min-height:0}
  #frame{width:100%;height:100%;border:0;background:#fff;display:none}
  #frame.on{display:block}
  .welcome{
    height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:32px 26px;max-width:620px;
  }
  .welcome h3{margin:0 0 10px;font-size:21px;letter-spacing:-.01em}
  .welcome p{margin:0 0 6px;color:var(--ink-soft);max-width:52ch}

  #scrim{
    display:none;position:fixed;inset:0;z-index:35;
    background:rgba(16,28,25,.5);backdrop-filter:blur(2px);
  }

  @media (max-width:900px){
    #topbar{display:flex}
    aside{
      transform:translateX(-100%);transition:transform .22s ease;
      width:min(84vw,300px);box-shadow:0 0 40px rgba(0,0,0,.35);
      padding-top:env(safe-area-inset-top);
    }
    aside.open{transform:none}
    #scrim.on{display:block}
    main{margin-left:0;height:calc(100% - 56px - env(safe-area-inset-top))}
    .crumb{padding:12px 16px}
    .welcome{padding:26px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="gate">
  <div class="gate-box">
    <h2 class="gate-title">자료실</h2>
    <p class="gate-sub">발급받은 아이디와 비밀번호를 입력하세요.</p>
    <div class="field">
      <label for="uid">아이디</label>
      <input id="uid" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="아이디">
    </div>
    <div class="field">
      <label for="upw">비밀번호</label>
      <input id="upw" type="password" autocomplete="off" placeholder="비밀번호">
    </div>
    <button id="enter">들어가기</button>
    <p id="gate-msg" role="status" aria-live="polite"></p>
  </div>
</div>

<!-- 본문 -->
<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="burger" aria-label="메뉴 열기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <strong id="topTitle">자료실</strong>
  </header>

  <div id="scrim"></div>

  <aside id="sidebar">
    <div class="brand">
      <h1 id="brandName">자료실</h1>
      <p id="brandSub">교육자료 모음</p>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="logout">로그아웃</button>
    </div>
  </aside>

  <main>
    <div class="crumb">
      <h2 id="crumbTitle">시작하기</h2>
      <span id="crumbSub">왼쪽에서 메뉴를 선택하세요</span>
      <span class="spacer"></span>
      <button class="ghost" id="openNew" hidden>새 탭에서 열기</button>
    </div>
    <div class="stage">
      <div class="welcome" id="welcome">
        <h3>메뉴를 선택하면 자료가 여기에 열립니다</h3>
        <p>왼쪽 목록에서 분류를 누르면 하위 항목이 펼쳐집니다. 항목을 누르면 자료가 이 화면 안에서 바로 열립니다.</p>
        <p>화면 안에서 열리지 않는 자료는 오른쪽 위 ‘새 탭에서 열기’를 눌러 보세요.</p>
      </div>
      <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" title="자료 보기"></iframe>
    </div>
  </main>
</div>

<!-- 암호화된 메뉴 데이터 (builder.html 로 생성) -->
<script src="data.enc.js"></script>

<script>
(() => {
  "use strict";

  /* ---------- 유틸 ---------- */
  const $ = s => document.querySelector(s);
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function deriveKey(id, pw, salt, iter) {
    const enc = new TextEncoder();
    const material = enc.encode(id.trim().toLowerCase() + "\u241F" + pw);
    const base = await crypto.subtle.importKey("raw", material, "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
  }

  /* ---------- 상태 ---------- */
  let DATA = null;          // 복호화된 메뉴 (메모리에만 존재)
  let fails = 0, locked = 0;

  /* ---------- 로그인 ---------- */
  const gate = $("#gate"), msg = $("#gate-msg"), btn = $("#enter");

  async function unlock() {
    const id = $("#uid").value, pw = $("#upw").value;
    if (!id || !pw) { msg.textContent = "아이디와 비밀번호를 모두 입력하세요."; return; }
    if (Date.now() < locked) {
      msg.textContent = `잠시 후 다시 시도하세요. (${Math.ceil((locked - Date.now())/1000)}초)`;
      return;
    }
    if (!window.__ENC__) { msg.textContent = "데이터 파일(data.enc.js)을 찾을 수 없습니다."; return; }
    if (!crypto.subtle) { msg.textContent = "https 또는 로컬 파일에서 열어 주세요."; return; }

    btn.disabled = true; btn.textContent = "확인 중…"; msg.textContent = "";
    try {
      const p = window.__ENC__;
      const key = await deriveKey(id, pw, b64d(p.salt), p.it);
      const buf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64d(p.iv) }, key, b64d(p.ct)
      );
      DATA = JSON.parse(new TextDecoder().decode(buf));
      start();
    } catch (e) {
      fails++;
      await wait(400);
      if (fails >= 5) { locked = Date.now() + 30000; fails = 0; msg.textContent = "시도 횟수를 초과했습니다. 30초 후 다시 시도하세요."; }
      else msg.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
    } finally {
      btn.disabled = false; btn.textContent = "들어가기";
    }
  }

  btn.addEventListener("click", unlock);
  ["#uid", "#upw"].forEach(s => $(s).addEventListener("keydown", e => { if (e.key === "Enter") unlock(); }));

  /* ---------- 메뉴 렌더링 ---------- */
  let current = null;

  function start() {
    document.title = DATA.title || "자료실";
    $("#brandName").textContent = DATA.title || "자료실";
    $("#brandSub").textContent = DATA.subtitle || "";
    $("#topTitle").textContent = DATA.title || "자료실";

    const nav = $("#nav");
    nav.textContent = "";
    DATA.cats.forEach((cat, ci) => {
      const wrap = document.createElement("div");
      wrap.className = "cat";

      const head = document.createElement("button");
      head.type = "button";
      head.setAttribute("aria-expanded", "false");
      head.append(document.createTextNode(cat.name));
      const caret = document.createElement("span");
      caret.className = "caret"; caret.textContent = "▶";
      head.append(caret);
      head.addEventListener("click", () => {
        const open = wrap.classList.toggle("open");
        head.setAttribute("aria-expanded", String(open));
      });

      const sub = document.createElement("div");
      sub.className = "sub";
      cat.items.forEach((item, ii) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = item.name;
        b.dataset.k = ci + "." + ii;   // 주소가 아닌 좌표만 DOM 에 남김
        b.addEventListener("click", () => open(ci, ii, b));
        sub.append(b);
      });

      wrap.append(head, sub);
      nav.append(wrap);
    });

    gate.remove();
    $("#app").classList.add("on");
  }

  function open(ci, ii, el) {
    const item = DATA.cats[ci].items[ii];
    document.querySelectorAll('.sub button[aria-current]').forEach(b => b.removeAttribute("aria-current"));
    el.setAttribute("aria-current", "true");
    current = item;

    $("#crumbTitle").textContent = item.name;
    $("#crumbSub").textContent = DATA.cats[ci].name;
    $("#openNew").hidden = false;
    $("#welcome").style.display = "none";

    const f = $("#frame");
    f.classList.add("on");
    f.src = item.url;                 // 주소는 이 순간에만 사용
    closeDrawer();
  }

  $("#openNew").addEventListener("click", () => {
    if (current) window.open(current.url, "_blank", "noopener,noreferrer");
  });

  /* ---------- 모바일 서랍 ---------- */
  const side = $("#sidebar"), scrim = $("#scrim");
  function openDrawer(){ side.classList.add("open"); scrim.classList.add("on"); }
  function closeDrawer(){ side.classList.remove("open"); scrim.classList.remove("on"); }
  $("#burger").addEventListener("click", openDrawer);
  scrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

  /* ---------- 로그아웃 ---------- */
  $("#logout").addEventListener("click", () => { DATA = null; location.reload(); });
})();
</script>
</body>
</html>
